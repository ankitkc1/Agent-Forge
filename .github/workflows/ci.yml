name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "services/api[dev]"
      - run: python -m ruff check services/api
      - run: python -m ruff format --check services/api
      - run: python -m pytest services/api/tests -q --cov=services/api/app --cov-report=term-missing --cov-fail-under=80

  generated:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "services/api[dev]"
      - run: python -m venv .venv-agent-runtime
      - run: .venv-agent-runtime/bin/python -m pip install --require-hashes --no-deps -r services/api/app/generator/runtime/requirements-dev.lock
      - run: AGENTFORGE_SANDBOX_PYTHON="$PWD/.venv-agent-runtime/bin/python" python -m pytest services/api/tests -q -m sandbox
      - run: python scripts/verify_templates.py --runtime .venv-agent-runtime/bin/python

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend, generated]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

