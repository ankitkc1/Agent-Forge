worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1m;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream agentforge_api { server api:8000; keepalive 16; }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://agentforge_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}

