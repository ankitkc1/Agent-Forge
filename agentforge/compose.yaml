name: agentforge

x-api-base: &api-base
  build:
    context: ./services/api
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    AGENTFORGE_DATABASE_URL: ${AGENTFORGE_DATABASE_URL:-postgresql+psycopg://agentforge:agentforge@postgres:5432/agentforge}
    AGENTFORGE_REDIS_URL: ${AGENTFORGE_REDIS_URL:-redis://redis:6379/0}
    AGENTFORGE_ARTIFACT_ROOT: /var/lib/agentforge/artifacts
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [frontend, backend]
  volumes:
    - artifacts:/var/lib/agentforge/artifacts
  restart: unless-stopped
  init: true

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${AGENTFORGE_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=2m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true

  api:
    <<: *api-base
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *api-base
    command: ["celery", "-A", "app.tasks.celery_app:celery", "worker", "--loglevel=INFO", "--concurrency=2", "--max-tasks-per-child=25"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery inspect ping -d celery@$$HOSTNAME --timeout=3 | grep -q pong"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.50"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentforge} -d ${POSTGRES_DB:-agentforge}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  artifacts: {}

