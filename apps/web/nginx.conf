worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream agentforge_api { server api:8000; keepalive 16; }

  # Strict policy for the workbench: everything (including fonts) is served from this origin.
  map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    # FastAPI's interactive docs load Swagger UI / ReDoc from jsDelivr and use inline bootstrapping.
    ~^/api/(docs|redoc) "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }

    # Live build updates (server-sent events): never buffer, allow long-lived connections.
    location ~ ^/api/v1/builds/[^/]+/stream$ {
      proxy_pass http://agentforge_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy $csp always;
    }

    # A normal prefix lets the more specific regex above handle event streams without buffering.
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://agentforge_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location ^~ /health/ {
      proxy_pass http://agentforge_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy $csp always;
    }

    # Single-page application: unknown paths render the workbench, which shows its own 404.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets/, so it can be cached forever.
    location ^~ /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
