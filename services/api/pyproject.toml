[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentforge-api"
version = "1.0.0"
description = "AgentForge control plane: requirement compiler, architecture planner, repository generator and verified build pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=43,<52",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "redis>=5.2,<9",
  "ruff>=0.8,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
agentforge = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "sandbox: runs generated repositories in the process sandbox (needs AGENTFORGE_SANDBOX_PYTHON)",
]
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/generator/templates/*"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["alembic/versions", "app/generator/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/compiler/domains.py" = ["E501"]
"tests/*" = ["B017"]
